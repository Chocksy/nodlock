name: Nodlock
options:
  bundleIdPrefix: ${SENTINEL_BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${SENTINEL_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  Nodlock:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Nodlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${SENTINEL_BUNDLE_ID}
        PRODUCT_NAME: Nodlock
        INFOPLIST_KEY_CFBundleDisplayName: Nodlock
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Nodlock/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nodlock/Nodlock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - NodlockUITests
  NodlockUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NodlockUITests
    dependencies:
      - target: Nodlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${SENTINEL_BUNDLE_ID}.uitests
        TEST_TARGET_NAME: Nodlock
        GENERATE_INFOPLIST_FILE: YES
