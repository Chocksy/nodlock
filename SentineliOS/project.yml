name: Sentinel
options:
  bundleIdPrefix: ${SENTINEL_BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${SENTINEL_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  Sentinel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sentinel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${SENTINEL_BUNDLE_ID}
        PRODUCT_NAME: Sentinel
        INFOPLIST_KEY_CFBundleDisplayName: Nodlock
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sentinel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sentinel/Sentinel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - SentinelUITests
  SentinelUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SentinelUITests
    dependencies:
      - target: Sentinel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${SENTINEL_BUNDLE_ID}.uitests
        TEST_TARGET_NAME: Sentinel
        GENERATE_INFOPLIST_FILE: YES
