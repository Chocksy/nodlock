# Nodlock status server. See README.md.
# Plain Docker: put your values in .env next to this file, then `docker compose up -d`.
# Coolify: "Docker Compose" build pack, base directory /server; set the variables in the UI.
# No ports are published: the checker is reachable only over your tailnet.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: nodlock-server
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=nodlock-server
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false          # kernel mode: the checker reaches tailnet IPs with plain sockets
      - TS_EXTRA_ARGS=--advertise-tags=tag:nodlock
      - TS_ACCEPT_DNS=true          # MagicDNS names resolve inside the shared namespace
    volumes:
      - ts-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  checker:
    build: .
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - NODLOCK_TOKEN=${NODLOCK_TOKEN}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-300}
      - SILENCE_MINUTES=${SILENCE_MINUTES:-10}
      - OPG_APNS_KEY_ID=${OPG_APNS_KEY_ID:-}
      - OPG_APNS_TEAM_ID=${OPG_APNS_TEAM_ID:-}
      - TZ=${TZ:-UTC}
    volumes:
      - data:/data
      - ./secrets:/secrets:ro       # only for Apple push: AuthKey_<KEY_ID>.p8
    restart: unless-stopped

volumes:
  ts-state:
  data:
